<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 야구장 주변 탐색</title>

    <!-- 카카오 지도 API 스크립트 (autoload=false로 동적 로딩 오류 방지, services 라이브러리 사용) -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ae5edfc836f986f7a6a7e5001c102c83&libraries=services&autoload=false"></script>

    <style>
        /* [1] 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* [2] 전체 레이아웃 (좌우 2분할) */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* [3] 왼쪽 영역: 탭 + 결과 리스트 */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #ffffff;
            border-right: 1px solid #dcdcdc;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
        }

        /* 상단 제목 + 탭 영역 */
        .tab-box {
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 12px;
        }

        .tab-group {
            display: flex;
            gap: 8px;
        }

        /* 탭 버튼 기본 모양 */
        .tab-button {
            flex: 1;
            padding: 10px 8px;
            background-color: #ffffff;
            color: #555555;
            border: 2px solid #dddddd;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tab-button:not(:disabled):hover {
            background-color: #f1f3f5;
        }

        /* 선택된 탭: 맛집 탭은 노랑 */
        .tab-button.active[data-tab="food"] {
            background-color: #ffd400;
            border-color: #e6bf00;
            color: #191919;
        }

        /* 선택된 탭: 방문할 만한 곳 탭은 파랑 */
        .tab-button.active[data-tab="baseball"] {
            background-color: #1e6fff;
            border-color: #1559d6;
            color: #ffffff;
        }

        /* 탭 아래 상태 안내 문구 */
        .status-text {
            margin-top: 10px;
            font-size: 12px;
            color: #777777;
            line-height: 1.5;
        }

        /* 검색 결과 리스트 */
        .result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .result-item:hover {
            background-color: #f5f8ff;
        }

        .place-title {
            font-size: 15px;
            font-weight: bold;
            color: #222222;
            margin-bottom: 4px;
        }

        .place-address {
            font-size: 13px;
            color: #666666;
            margin-bottom: 2px;
        }

        .place-phone {
            font-size: 12px;
            color: #0969da;
        }

        /* 결과가 없을 때 안내 문구 */
        .empty-message {
            padding: 30px 20px;
            text-align: center;
            font-size: 14px;
            color: #999999;
        }

        /* 페이지네이션 (페이지 번호 목록) */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            gap: 6px;
            border-top: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .pagination:empty {
            display: none;
        }

        .pagination a {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            font-size: 13px;
            color: #555555;
            text-decoration: none;
            border-radius: 4px;
        }

        .pagination a.on {
            background-color: #333333;
            color: #ffffff;
            font-weight: bold;
        }

        /* [4] 오른쪽 영역: 카카오 지도 */
        .map-container {
            flex: 1;
            height: 100%;
        }

        /* 지도 팝업(인포윈도우) 내용 */
        .info-window {
            padding: 10px 14px;
            min-width: 180px;
            font-size: 13px;
            color: #333333;
        }

        .info-window .info-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .info-window .info-address {
            color: #666666;
            font-size: 12px;
            white-space: nowrap;
        }

        /* 내 위치 라벨 */
        .my-location-label {
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #e03131;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽: 탭 및 결과 영역 -->
        <div class="sidebar">
            <div class="tab-box">
                <div class="sidebar-title">⚾ 야구장 주변 탐색</div>

                <!-- 탭 버튼 2개 (지도 준비 전에는 비활성화) -->
                <div class="tab-group">
                    <button class="tab-button" data-tab="food" disabled>🍜 야구장 근처 맛집</button>
                    <button class="tab-button" data-tab="baseball" disabled>⚾ 방문할 만한 곳</button>
                </div>

                <!-- 현재 상태 안내 -->
                <div id="statusText" class="status-text">내 위치를 확인하는 중이에요...</div>
            </div>

            <!-- 검색 결과 목록 -->
            <ul id="placesList" class="result-list"></ul>

            <!-- 페이지 이동 번호 -->
            <div id="pagination" class="pagination"></div>
        </div>

        <!-- 오른쪽: 지도 표시 영역 -->
        <div id="map" class="map-container"></div>
    </div>

    <script>
        // ===== 탭 설정 =====
        // 탭마다 검색 방식, 검색어, 마커 색, 검색 반경(m)을 한곳에서 관리
        const TAB_CONFIG = {
            food: {
                label: '야구장 근처 맛집',
                searchType: 'category',   // 카테고리 검색
                query: 'FD6',             // FD6 = 음식점 카테고리 코드
                markerColor: '#ffd400',   // 노랑
                radius: 1000
            },
            baseball: {
                label: '야구장 근처 방문할 만한 곳',
                searchType: 'keyword',    // 키워드 검색
                query: '야구 시설',
                markerColor: '#1e6fff',   // 파랑
                radius: 5000
            }
        };

        // 기본 좌표 (위치 권한 거부 시 사용: 서울시청)
        const DEFAULT_LAT = 37.5665;
        const DEFAULT_LNG = 126.9780;

        // ===== 전역 변수 =====
        let map = null;              // 지도 객체
        let placesService = null;    // 장소 검색 서비스 객체
        let infoWindow = null;       // 마커 클릭 시 뜨는 팝업
        let markers = [];            // 검색 결과 마커 목록
        let userPosition = null;     // 내 위치 좌표 (kakao.maps.LatLng)
        let currentTab = null;       // 현재 선택된 탭 이름
        let markerImages = {};       // 탭별 마커 이미지 (한 번만 만들어 재사용)

        // [핵심] 카카오 지도 SDK가 다 로드된 뒤에 실행
        kakao.maps.load(function () {
            getUserLocationAndInitMap();
        });

        /**
         * 사용자의 현재 위치를 받아와 지도를 초기화하는 함수
         */
        function getUserLocationAndInitMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        // 위치 권한 허용 시: 현재 위치 사용
                        initMap(position.coords.latitude, position.coords.longitude, true);
                    },
                    function (error) {
                        // 위치 권한 거부 또는 실패 시: 기본 위치 사용
                        console.warn('위치 정보를 불러올 수 없어 기본 위치로 지정합니다.', error);
                        initMap(DEFAULT_LAT, DEFAULT_LNG, false);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                // Geolocation을 지원하지 않는 브라우저
                initMap(DEFAULT_LAT, DEFAULT_LNG, false);
            }
        }

        /**
         * 카카오 지도를 생성하고 탭 이벤트를 연결하는 함수
         * @param {number} lat - 위도
         * @param {number} lng - 경도
         * @param {boolean} isCurrentLocation - 실제 내 위치인지 여부
         */
        function initMap(lat, lng, isCurrentLocation) {
            userPosition = new kakao.maps.LatLng(lat, lng);

            // 지도 객체 생성
            map = new kakao.maps.Map(document.getElementById('map'), {
                center: userPosition,
                level: 5
            });

            // 장소 검색 서비스와 팝업 객체 생성 (removable: 팝업에 X 버튼 표시)
            placesService = new kakao.maps.services.Places();
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 3, removable: true });

            // 탭별 마커 이미지 미리 만들기
            Object.keys(TAB_CONFIG).forEach(function (tabName) {
                markerImages[tabName] = createPinImage(TAB_CONFIG[tabName].markerColor);
            });

            // 내 위치를 지도에 표시
            showMyLocation(isCurrentLocation);

            // 지도 빈 곳을 누르면 팝업 닫기
            kakao.maps.event.addListener(map, 'click', function () {
                infoWindow.close();
            });

            // 상태 안내 문구
            const statusText = document.getElementById('statusText');
            statusText.innerText = isCurrentLocation
                ? '내 위치 기준으로 검색해요. 탭을 눌러보세요!'
                : '위치 권한이 없어 서울시청 기준으로 검색해요. 탭을 눌러보세요!';

            // 탭 버튼 활성화 + 클릭 이벤트 연결
            document.querySelectorAll('.tab-button').forEach(function (button) {
                button.disabled = false;
                button.addEventListener('click', function () {
                    selectTab(button.dataset.tab);
                });
            });
        }

        /**
         * 내 위치를 빨간 점 마커와 라벨로 지도에 표시하는 함수
         * @param {boolean} isCurrentLocation - 실제 내 위치인지 여부
         */
        function showMyLocation(isCurrentLocation) {
            // 빨간 점 모양 SVG (가운데 흰 테두리)
            const dotSvg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">' +
                '<circle cx="12" cy="12" r="10" fill="#e03131" stroke="#ffffff" stroke-width="3"/>' +
                '</svg>';

            const dotImage = new kakao.maps.MarkerImage(
                'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(dotSvg),
                new kakao.maps.Size(24, 24),
                { offset: new kakao.maps.Point(12, 12) } // 점의 정중앙이 위치에 오도록
            );

            // 내 위치 마커 (검색 결과 마커와 별도로 관리 → 탭을 바꿔도 지워지지 않음)
            new kakao.maps.Marker({
                position: userPosition,
                image: dotImage,
                map: map,
                zIndex: 2
            });

            // 마커 위에 "현재 나의 위치" 라벨 표시
            const labelText = isCurrentLocation ? '📍 현재 나의 위치' : '📍 기본 위치 (서울시청)';
            new kakao.maps.CustomOverlay({
                position: userPosition,
                content: '<div class="my-location-label" style="background:#fff;border:1px solid #e03131;border-radius:12px;">' + labelText + '</div>',
                yAnchor: 2.2,
                map: map
            });

            // 내 위치 주변 반경을 연한 원으로 표시
            new kakao.maps.Circle({
                center: userPosition,
                radius: 80,
                strokeWeight: 1,
                strokeColor: '#e03131',
                strokeOpacity: 0.5,
                fillColor: '#e03131',
                fillOpacity: 0.12,
                map: map
            });
        }

        /**
         * 지정한 색의 핀 모양 마커 이미지를 만드는 함수
         * @param {string} color - 마커 색 (예: '#ffd400')
         */
        function createPinImage(color) {
            const pinSvg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="-1 -1 30 42">' +
                '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" ' +
                'fill="' + color + '" stroke="#333333" stroke-width="1.5"/>' +
                '<circle cx="14" cy="14" r="5" fill="#ffffff"/>' +
                '</svg>';

            return new kakao.maps.MarkerImage(
                'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(pinSvg),
                new kakao.maps.Size(30, 42),
                { offset: new kakao.maps.Point(15, 42) } // 핀 끝부분이 위치에 오도록
            );
        }

        /**
         * 탭을 선택했을 때 실행되는 함수
         * @param {string} tabName - 'food' 또는 'baseball'
         */
        function selectTab(tabName) {
            const config = TAB_CONFIG[tabName];
            currentTab = tabName;

            // 탭 버튼 모양 바꾸기 (선택된 탭만 active)
            document.querySelectorAll('.tab-button').forEach(function (button) {
                button.classList.toggle('active', button.dataset.tab === tabName);
            });

            // 기존 마커, 리스트, 페이지 번호, 팝업 모두 지우기
            clearResults();

            document.getElementById('statusText').innerText =
                '"' + config.label + '"을(를) 반경 ' + (config.radius / 1000) + 'km 안에서 찾는 중...';

            // 검색 옵션: 내 위치 기준, 반경 안, 가까운 순 정렬
            const searchOptions = {
                location: userPosition,
                radius: config.radius,
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            // 이 탭 전용 콜백 (검색 도중 다른 탭으로 바꾸면 늦게 온 결과는 무시)
            const callback = function (data, status, pagination) {
                if (currentTab !== tabName) return;
                placesSearchCB(data, status, pagination, tabName);
            };

            // 탭 설정에 따라 카테고리 검색 또는 키워드 검색
            if (config.searchType === 'category') {
                placesService.categorySearch(config.query, callback, searchOptions);
            } else {
                placesService.keywordSearch(config.query, callback, searchOptions);
            }
        }

        /**
         * 장소 검색 완료 시 호출되는 콜백 함수
         * @param {Array} data - 검색 결과 배열
         * @param {string} status - 검색 결과 상태
         * @param {Object} pagination - 페이지네이션 정보
         * @param {string} tabName - 검색한 탭 이름
         */
        function placesSearchCB(data, status, pagination, tabName) {
            const config = TAB_CONFIG[tabName];
            const statusText = document.getElementById('statusText');

            if (status === kakao.maps.services.Status.OK) {
                statusText.innerText =
                    '"' + config.label + '" ' + pagination.totalCount + '곳을 찾았어요. (가까운 순)';
                displayPlaces(data, tabName);
                displayPagination(pagination);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                clearResults();
                statusText.innerText = '반경 ' + (config.radius / 1000) + 'km 안에 결과가 없어요.';
                showEmptyMessage('주변에 검색 결과가 없어요 😢');
            } else {
                clearResults();
                statusText.innerText = '검색 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.';
                showEmptyMessage('검색 중 오류가 발생했어요.');
            }
        }

        /**
         * 검색 결과를 리스트와 지도 마커로 표시하는 함수
         * @param {Array} places - 장소 데이터 목록
         * @param {string} tabName - 현재 탭 이름 (마커 색 결정)
         */
        function displayPlaces(places, tabName) {
            const listElement = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();

            // 페이지를 넘길 때도 이전 마커/리스트는 지우기
            removeAllMarkers();
            listElement.innerHTML = '';
            infoWindow.close();

            // 내 위치도 화면 안에 보이도록 범위에 포함
            bounds.extend(userPosition);

            places.forEach(function (place, index) {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                const marker = addMarker(placePosition, markerImages[tabName]);
                const itemElement = createListItem(place, index);

                bounds.extend(placePosition);

                // 마커를 누르면 장소 이름 + 주소 팝업 표시
                kakao.maps.event.addListener(marker, 'click', function () {
                    displayInfoWindow(marker, place);
                });

                // 리스트 항목을 누르면 그 위치로 이동하고 팝업 표시
                itemElement.addEventListener('click', function () {
                    map.panTo(placePosition);
                    displayInfoWindow(marker, place);
                });

                listElement.appendChild(itemElement);
            });

            // 모든 결과(+내 위치)가 보이도록 지도 범위 조정
            map.setBounds(bounds);
        }

        /**
         * 검색 결과 목록 항목(li)을 만드는 함수
         * @param {Object} place - 장소 정보 객체
         * @param {number} index - 인덱스 번호
         */
        function createListItem(place, index) {
            const li = document.createElement('li');
            li.className = 'result-item';

            const title = document.createElement('div');
            title.className = 'place-title';
            title.innerText = (index + 1) + '. ' + place.place_name;

            const address = document.createElement('div');
            address.className = 'place-address';
            address.innerText = getAddress(place);

            const phone = document.createElement('div');
            phone.className = 'place-phone';
            // 거리 정보(m)가 있으면 함께 표시
            const distanceText = place.distance ? ' · ' + place.distance + 'm' : '';
            phone.innerText = (place.phone ? place.phone : '전화번호 정보 없음') + distanceText;

            li.appendChild(title);
            li.appendChild(address);
            li.appendChild(phone);

            return li;
        }

        /**
         * 도로명 주소가 있으면 도로명, 없으면 지번 주소를 돌려주는 함수
         * @param {Object} place - 장소 정보 객체
         */
        function getAddress(place) {
            return place.road_address_name ? place.road_address_name : place.address_name;
        }

        /**
         * 지도에 마커를 만들고 배열에 담는 함수
         * @param {Object} position - 마커 위치 좌표
         * @param {Object} image - 마커 이미지 (탭별 색)
         */
        function addMarker(position, image) {
            const marker = new kakao.maps.Marker({
                position: position,
                image: image,
                map: map
            });

            markers.push(marker);
            return marker;
        }

        /**
         * 지도 위 검색 결과 마커를 모두 지우는 함수 (내 위치 마커는 유지)
         */
        function removeAllMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });
            markers = [];
        }

        /**
         * 마커, 리스트, 페이지 번호, 팝업을 모두 지우는 함수
         */
        function clearResults() {
            removeAllMarkers();
            document.getElementById('placesList').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
            if (infoWindow) infoWindow.close();
        }

        /**
         * 리스트 영역에 안내 문구를 보여주는 함수
         * @param {string} message - 보여줄 문구
         */
        function showEmptyMessage(message) {
            const li = document.createElement('li');
            li.className = 'empty-message';
            li.innerText = message;
            document.getElementById('placesList').appendChild(li);
        }

        /**
         * 마커 위에 장소 이름과 주소 팝업을 띄우는 함수
         * @param {Object} marker - 마커 객체
         * @param {Object} place - 장소 정보 객체
         */
        function displayInfoWindow(marker, place) {
            // 장소 이름에 특수문자가 있어도 안전하도록 escapeHtml 처리
            const content =
                '<div class="info-window">' +
                '<div class="info-name">' + escapeHtml(place.place_name) + '</div>' +
                '<div class="info-address">' + escapeHtml(getAddress(place)) + '</div>' +
                '</div>';

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        /**
         * HTML 특수문자를 안전한 글자로 바꾸는 함수
         * @param {string} text - 원래 문자열
         */
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * 페이지 이동 번호를 만드는 함수
         * @param {Object} pagination - 카카오 페이지네이션 객체
         */
        function displayPagination(pagination) {
            const paginationElement = document.getElementById('pagination');
            paginationElement.innerHTML = '';

            for (let i = 1; i <= pagination.last; i++) {
                const pageAnchor = document.createElement('a');
                pageAnchor.href = '#';
                pageAnchor.innerText = i;

                if (i === pagination.current) {
                    pageAnchor.className = 'on';
                } else {
                    // let i 덕분에 각 버튼이 자기 페이지 번호를 기억함
                    pageAnchor.addEventListener('click', function (event) {
                        event.preventDefault();
                        pagination.gotoPage(i);
                    });
                }

                paginationElement.appendChild(pageAnchor);
            }
        }
    </script>
</body>
</html>
